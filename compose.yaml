name: event-registration

x-backend: &backend
  image: event-registration-backend:local
  build:
    context: ./backend
    target: runtime
  environment: &backend-environment
    DATABASE_URL: postgresql+asyncpg://${CORE_DB_USER:-core_app}:${CORE_DB_PASSWORD:-local_core_password_change_me}@db:5432/${POSTGRES_DB:-event_registration}
    ORGANIZER_TOKEN: ${ORGANIZER_TOKEN:?Set ORGANIZER_TOKEN in .env}
    SSE_MAX_CONNECTIONS: ${SSE_MAX_CONNECTIONS:-2000}

x-bootstrap: &bootstrap
  image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
  volumes:
    - ./infrastructure/postgres:/bootstrap:ro
  restart: "no"

x-notifications: &notifications
  image: event-notifications:local
  build:
    context: ./notifications
    target: runtime
  environment: &notifications-environment
    DATABASE_URL: postgresql+asyncpg://${NOTIFICATIONS_DB_USER:-notifications_app}:${NOTIFICATIONS_DB_PASSWORD:-local_notifications_password_change_me}@db:5432/${NOTIFICATIONS_DB:-event_notifications}
    NOTIFICATIONS_INTERNAL_TOKEN: ${NOTIFICATIONS_INTERNAL_TOKEN:-local_notifications_internal_token_change_me_32_chars}

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_registration}
      POSTGRES_USER: ${POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  db-bootstrap:
    <<: *bootstrap
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-events}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      CORE_DB: ${POSTGRES_DB:-event_registration}
      CORE_USER: ${CORE_DB_USER:-core_app}
      CORE_PASSWORD: ${CORE_DB_PASSWORD:-local_core_password_change_me}
      NOTIFICATIONS_DB: ${NOTIFICATIONS_DB:-event_notifications}
      NOTIFICATIONS_USER: ${NOTIFICATIONS_DB_USER:-notifications_app}
      NOTIFICATIONS_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-local_notifications_password_change_me}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  notifications-migrate:
    <<: *notifications
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  notifications:
    <<: *notifications
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  notifications-sender:
    <<: *notifications
    command: ["python", "-m", "notifications_app.worker"]
    environment:
      <<: *notifications-environment
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-events@example.test}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      SENDER_TIMEOUT: ${SENDER_TIMEOUT:-5}
      SENDER_POLL_INTERVAL: ${SENDER_POLL_INTERVAL:-5}
      SENDER_MAX_ATTEMPTS: ${SENDER_MAX_ATTEMPTS:-8}
      SENDER_BACKOFF_BASE: ${SENDER_BACKOFF_BASE:-1}
      SENDER_BACKOFF_CAP: ${SENDER_BACKOFF_CAP:-60}
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "notifications_app.worker_health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-1}", "--timeout-graceful-shutdown", "5"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      NOTIFICATIONS_URL: http://notifications:8000
      RELAY_CANDIDATE_LIMIT: ${RELAY_CANDIDATE_LIMIT:-20}
      NOTIFICATIONS_INTERNAL_TOKEN: ${NOTIFICATIONS_INTERNAL_TOKEN:-local_notifications_internal_token_change_me_32_chars}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      REGISTER_RATE: ${REGISTER_RATE:-30r/s}
      REGISTER_BURST: ${REGISTER_BURST:-1000}
      SSE_LIMIT: ${SSE_LIMIT:-2000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_QUIET: "true"
      MP_IGNORE_DUPLICATE_IDS: "true"
      MP_MAX_MESSAGES: "0"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  test-mailpit:
    profiles: ["test"]
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_IGNORE_DUPLICATE_IDS: "true"
      MP_MAX_MESSAGES: "0"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_QUIET: "true"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: event_registration_test
      POSTGRES_USER: events_test
      POSTGRES_PASSWORD: test_database_password_local_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_test -d event_registration_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://core_app_test:core_database_password_local_only@test-db:5432/event_registration_test
      TEST_DATABASE_URL: postgresql+asyncpg://core_app_test:core_database_password_local_only@test-db:5432/event_registration_test
      ORGANIZER_TOKEN: test_organizer_token_32_characters_minimum
    command: ["sh", "-c", "alembic upgrade head && pytest && alembic check"]
    depends_on:
      test-db-bootstrap:
        condition: service_completed_successfully

  test-db-bootstrap:
    <<: *bootstrap
    profiles: ["test"]
    environment: &test-bootstrap-environment
      PGHOST: test-db
      PGUSER: events_test
      PGPASSWORD: test_database_password_local_only
      CORE_DB: event_registration_test
      CORE_USER: core_app_test
      CORE_PASSWORD: core_database_password_local_only
      NOTIFICATIONS_DB: event_notifications_test
      NOTIFICATIONS_USER: notifications_app_test
      NOTIFICATIONS_PASSWORD: notifications_database_password_local_only
    depends_on:
      test-db:
        condition: service_healthy

  notifications-test:
    profiles: ["test"]
    build:
      context: ./notifications
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://notifications_app_test:notifications_database_password_local_only@test-db:5432/event_notifications_test
      TEST_DATABASE_URL: postgresql+asyncpg://notifications_app_test:notifications_database_password_local_only@test-db:5432/event_notifications_test
      TEST_CORE_DATABASE_URL: postgresql+asyncpg://core_app_test:core_database_password_local_only@test-db:5432/event_registration_test
      SMTP_HOST: test-mailpit
      SMTP_PORT: "1025"
      TEST_MAILPIT_URL: http://test-mailpit:8025
      NOTIFICATIONS_INTERNAL_TOKEN: test_notifications_internal_token_32_characters_minimum
    command: ["sh", "-c", "alembic upgrade head && pytest && alembic check"]
    depends_on:
      test-db-bootstrap:
        condition: service_completed_successfully
      test-mailpit:
        condition: service_healthy

  bootstrap-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: bootstrap-test
      additional_contexts:
        notifications: ./notifications
    environment:
      <<: *test-bootstrap-environment
      TEST_CORE_DATABASE_URL: postgresql+asyncpg://core_app_test:core_database_password_local_only@test-db:5432/event_registration_test
      TEST_NOTIFICATIONS_DATABASE_URL: postgresql+asyncpg://notifications_app_test:notifications_database_password_local_only@test-db:5432/event_notifications_test
      NOTIFICATIONS_INTERNAL_TOKEN: test_notifications_internal_token_32_characters_minimum
      PYTHONPATH: /app:/notifications
      MYPYPATH: /app:/notifications
      SMTP_HOST: test-mailpit
      SMTP_PORT: "1025"
      TEST_MAILPIT_URL: http://test-mailpit:8025
    volumes:
      - ./infrastructure/postgres:/bootstrap:ro
      - ./infrastructure/tests:/bootstrap-tests:ro
      - ./infrastructure/checks:/checks:ro
      - ./notifications:/notifications:ro
      - ./docs/notification-contract-v1.schema.json:/contract/v1.schema.json:ro
    command: ["pytest", "-c", "/app/pyproject.toml", "/bootstrap-tests"]
    depends_on:
      test-db-bootstrap:
        condition: service_completed_successfully
      test-mailpit:
        condition: service_healthy

volumes:
  postgres-data:
  mailpit-data:
