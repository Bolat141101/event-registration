# Shared across Nginx workers. Never trust incoming X-Forwarded-For as a rate key.
limit_req_zone $binary_remote_addr zone=registration_clients:10m rate=${REGISTER_RATE};
# A global SSE budget avoids a small per-IP cap for a venue sharing one NAT.
limit_conn_zone $server_name zone=live_total:1m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    client_max_body_size 32k;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @throttled;

    location ~ ^/api/events/[^/]+/registrations$ {
        limit_req zone=registration_clients burst=${REGISTER_BURST} nodelay;
        include /etc/nginx/api-proxy.inc;
    }
    location ~ ^/api/events/[^/]+/stream$ {
        limit_conn live_total ${SSE_LIMIT};
        include /etc/nginx/api-proxy.inc;
    }
    location /api/ {
        include /etc/nginx/api-proxy.inc;
    }
    location @throttled {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"code":"rate_limited","message":"Please wait a moment and try again"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
