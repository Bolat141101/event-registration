name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend, PostgreSQL, frontend and Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: event-registration-relay-check-ui-ci
      COMPOSE_FILE: compose.yaml:compose.browser-test.yaml
      COMPOSE_ENV_FILES: .env.example
      COMPOSE_PROFILES: test
      POSTGRES_PORT: "0"
      FRONTEND_PORT: "0"
      MAILPIT_PORT: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend and test images
        run: docker compose build api test notifications notifications-test bootstrap-test

      - name: Ruff
        run: |
          docker compose run --rm --no-deps test ruff check .
          docker compose run --rm --no-deps test ruff format --check .

      - name: Mypy
        run: docker compose run --rm --no-deps test mypy app tests/conftest.py tests/integration/test_relay_blocking.py tests/integration/test_live.py

      - name: Core migrations and full Pytest suite as unprivileged core_app_test
        run: docker compose run --rm test

      - name: Notifications lint, types, PostgreSQL migrations and tests
        run: |
          docker compose run --rm --no-deps notifications-test ruff check .
          docker compose run --rm --no-deps notifications-test ruff format --check .
          docker compose run --rm --no-deps notifications-test mypy notifications_app
          docker compose run --rm notifications-test

      - name: Repeat bootstrap with persisted test data and verify database isolation
        run: |
          docker compose run --rm --no-deps bootstrap-test ruff check --config /app/pyproject.toml /bootstrap-tests /checks
          docker compose run --rm --no-deps bootstrap-test ruff format --check --config /app/pyproject.toml /bootstrap-tests /checks
          docker compose run --rm --no-deps bootstrap-test mypy --config-file /app/pyproject.toml /bootstrap-tests /checks
          docker compose run --rm bootstrap-test

      - name: TypeScript and Vite production build
        run: docker compose build frontend

      - name: Start Compose services and apply application migrations
        run: |
          BROWSER_TEST_PROJECT="$COMPOSE_PROJECT_NAME" scripts/browser-test.sh start
          echo "PUBLIC_APP_URL=http://$(docker compose port frontend 80)" >> "$GITHUB_ENV"

      - name: Verify API health through frontend proxy
        run: |
          address=$(docker compose port frontend 80)
          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            --retry-delay 2 --max-time 10 "http://${address}/api/health" \
            | python3 -c 'import json, sys; body = json.load(sys.stdin); assert body == {"status": "ok", "database": "ready"}, body; print(body)'

      - name: Verify Notifications readiness and Core independence
        run: |
          docker compose exec -T notifications python -c 'import json, urllib.request; body = json.load(urllib.request.urlopen("http://localhost:8000/health", timeout=5)); assert body == {"status": "ok", "database": "ready"}, body'
          docker compose stop notifications
          address=$(docker compose port frontend 80)
          curl --fail --silent --show-error --max-time 10 "http://${address}/api/health"
          curl --fail --silent --show-error --max-time 10 "http://${address}/api/events"
          docker compose up --no-build --no-deps -d --wait --wait-timeout 60 notifications

      - name: Real HTTP relay outage, response loss and process restart
        run: |
          smoke() {
            docker compose run --rm --no-deps -T -e RELAY_SMOKE_PROJECT="$COMPOSE_PROJECT_NAME" worker python - "$1" < infrastructure/checks/relay_smoke.py
          }
          docker compose stop notifications
          smoke create
          smoke outage
          docker compose kill -s SIGKILL worker
          docker compose up --no-build --no-deps -d --wait --wait-timeout 60 notifications
          docker compose up --no-build --no-deps -d worker
          smoke recover
          docker compose stop worker
          smoke lost-response
          docker compose restart notifications
          docker compose up --no-build --no-deps -d --wait --wait-timeout 60 notifications
          docker compose up --no-build --no-deps -d worker
          smoke recover

      - name: Real SMTP outage, sender restart and lost DATA response
        run: |
          core() {
            docker compose run --rm --no-deps -T -e RELAY_SMOKE_PROJECT="$COMPOSE_PROJECT_NAME" worker python - create < infrastructure/checks/relay_smoke.py
          }
          smtp() {
            docker compose run --rm --no-deps -T -e RELAY_SMOKE_PROJECT="$COMPOSE_PROJECT_NAME" notifications-sender python - "$1" < infrastructure/checks/smtp_smoke.py
          }
          smtp recover
          docker compose pause mailpit
          core
          smtp outage
          docker compose kill -s SIGKILL notifications-sender
          docker compose unpause mailpit
          docker compose up --no-build --no-deps -d notifications-sender
          smtp recover
          docker compose stop notifications-sender
          core
          smtp lost-response
          docker compose restart notifications
          docker compose up --no-build --no-deps -d --wait --wait-timeout 60 notifications
          docker compose up --no-build --no-deps -d notifications-sender
          smtp recover

      - name: Real edge admission limits and shared NAT
        run: |
          docker compose run --rm -d --no-deps --name "$COMPOSE_PROJECT_NAME-limits" \
            -e REGISTER_RATE=1r/m -e REGISTER_BURST=2 -e SSE_LIMIT=2 frontend
          docker compose run --rm --no-deps -T -e LOAD_PROJECT="$COMPOSE_PROJECT_NAME" worker \
            python - < infrastructure/checks/limit_probe.py
          docker rm -f "$COMPOSE_PROJECT_NAME-limits"

      - name: Playwright E2E against real PostgreSQL and Mailpit
        run: |
          export E2E_BASE_URL="http://$(docker compose port frontend 80)"
          export E2E_MAILPIT_URL="http://$(docker compose port mailpit 8025)"
          docker run --rm --name "$COMPOSE_PROJECT_NAME-e2e" --network host --ipc=host \
            -v "$PWD/frontend:/work" -w /work \
            -e E2E_BASE_URL -e E2E_MAILPIT_URL -e E2E_ISOLATED_PROJECT="$COMPOSE_PROJECT_NAME" \
            -e E2E_ORGANIZER_KEY=local_organizer_token_change_me_32_chars_minimum \
            node:24-bookworm sh -c 'npm ci && npx playwright install --with-deps chromium && npm run test:e2e'

      - name: Show Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Remove only isolated CI containers
        if: always()
        run: |
          mailpit=$(docker compose ps -q mailpit)
          if [ -n "$mailpit" ] && [ "$(docker inspect -f '{{.State.Paused}}' "$mailpit")" = "true" ]; then
            docker compose unpause mailpit
          fi
          docker rm -f "$COMPOSE_PROJECT_NAME-e2e" "$COMPOSE_PROJECT_NAME-limits" 2>/dev/null || true
          docker compose down --remove-orphans
