[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "event-notifications"
version = "0.1.0"
description = "Independent notification infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.9,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["notifications_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires a dedicated PostgreSQL test database"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["notifications_app"]
